<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Program HR pertama yang dibangun untuk era AI · RevoU</title>
<meta name="description" content="Jawab empat pertanyaan singkat dan lihat posisi kamu sekarang dan yang diperlukan untuk mencapai tujuan kamu.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
  /* Inlined ahead of app.css so the first paint is never a white flash. */
  :root {
    --c-blue: #293ff5;
    --c-blue-deep: #052699;
    --c-yellow: #ffde3d;
    --sans: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  html, body {
    margin: 0;
    height: 100%;
    background:
      radial-gradient(55% 46% at 0% 100%, rgba(0, 218, 201, 0.30) 0%, rgba(0, 218, 201, 0.10) 55%, rgba(0, 218, 201, 0) 100%),
      radial-gradient(48% 52% at 100% 6%, rgba(255, 15, 76, 0.24) 0%, rgba(255, 15, 76, 0.08) 55%, rgba(255, 15, 76, 0) 100%),
      radial-gradient(70% 60% at 50% 34%, rgba(17, 106, 248, 0.45) 0%, rgba(41, 63, 245, 0.22) 55%, rgba(41, 63, 245, 0) 100%),
      var(--c-blue);
    color: #fff;
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
</style>
</head>
<body>

<div class="app">
  <!-- Screen 1 — Hero. No program name here; the name is the payoff. -->
  <section class="hero" id="hero">
    <img src="revou-logo.svg" alt="RevoU" class="hero-logo">
    <div>
      <p class="eyebrow" id="hero-eyebrow"></p>
      <h1 id="hero-headline"></h1>
    </div>
    <div class="hero-rule"></div>
    <button class="btn-primary" id="hero-cta" type="button"></button>
  </section>

  <!-- Screens 2–6 — one continuous conversation -->
  <section class="chat" id="chat" data-active="false">
    <header class="topbar">
      <button class="back" id="back" type="button" aria-label="Kembali ke pertanyaan sebelumnya">←</button>
      <img src="revou-logo.svg" alt="" class="topbar-logo">
      <div class="topbar-meta">
        <span class="who">RevoU</span>
        <span class="eyebrow step" id="step-label">Program baru · September 2026</span>
      </div>
    </header>
    <div class="progress" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0" aria-label="Kemajuan"><i id="progress-bar"></i></div>
    <div class="log" id="log" role="log" aria-live="polite" aria-relevant="additions text"></div>
    <div class="composer"><div class="options" id="options"></div></div>
  </section>
</div>
<div class="curtain" id="curtain" data-show="false" aria-hidden="true"></div>

<script type="module">
import { HERO, QUESTIONS, HANDOFF, EXIT } from './quiz-data.js';

const $ = (id) => document.getElementById(id);
const log = $('log');
const options = $('options');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// Shared with the reveal page so both documents report the same visit. A fresh
// id per document would split one visitor's events across two sessions.
const session = (() => {
  const key = 'hrp:sid';
  let id = null;
  try { id = sessionStorage.getItem(key); } catch { /* private mode */ }
  if (!id) {
    id = (crypto.randomUUID?.() ?? String(Date.now())).slice(0, 8);
    try { sessionStorage.setItem(key, id); } catch { /* ignore */ }
  }
  return id;
})();

// `gen` invalidates an in-flight step when the visitor taps back, so a rewound
// question can never resolve into the abandoned branch of the flow.
const state = { step: 0, answers: [], busy: false, gen: 0, resolveAsk: null };

/* ---------- helpers ---------- */

const wait = (ms) => new Promise((r) => setTimeout(r, reduced ? Math.min(ms, 60) : ms));

function scrollDown() {
  log.scrollTo({ top: log.scrollHeight, behavior: reduced ? 'auto' : 'smooth' });
}

// The composer grows when option chips appear, which shrinks the log without
// moving its scroll offset — the newest bubble would slide up out of view,
// looking as if the chips covered it. Re-pin the log on every composer resize,
// including the staggered chip animation and clearing them again.
if (window.ResizeObserver) {
  new ResizeObserver(() => scrollDown()).observe(document.querySelector('.composer'));
}

function node(tag, cls, parent) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  el.dataset.step = String(state.step);
  (parent ?? log).append(el);
  return el;
}

function row(side, { stacked = false } = {}) {
  const r = node('div', `row${side === 'me' ? ' me' : ''}${stacked ? ' stacked' : ''}`);
  if (side !== 'me') r.append(Object.assign(document.createElement('div'), { className: 'avatar' }));
  scrollDown();
  return r;
}

async function typingPause(ms = 620) {
  const r = row('bot');
  const dots = document.createElement('div');
  dots.className = 'bubble typing';
  dots.innerHTML = '<span></span><span></span><span></span>';
  r.append(dots);
  scrollDown();
  await wait(ms);
  r.remove();
}

/** Types text out character by character; instant when reduced motion is on. */
async function typeInto(el, text) {
  if (reduced) { el.textContent = text; scrollDown(); return; }
  const caret = document.createElement('i');
  caret.className = 'caret';
  el.append(caret);
  const step = text.length > 160 ? 3 : 1;
  for (let i = 0; i < text.length; i += step) {
    caret.before(document.createTextNode(text.slice(i, i + step)));
    if (i % 12 === 0) scrollDown();
    await wait(11);
  }
  caret.remove();
  scrollDown();
}

/** One bot message. `pause` is the typing-indicator dwell before it appears. */
async function say(text, { pause = 620, cls = '', stacked = false, sub = '' } = {}) {
  if (pause) await typingPause(pause);
  const r = row('bot', { stacked });
  const b = document.createElement('div');
  b.className = `bubble ${cls}`.trim();
  r.append(b);
  await typeInto(b, text);
  if (sub) {
    const s = document.createElement('span');
    s.className = 'sub';
    s.textContent = sub;
    b.append(s);
    scrollDown();
  }
  return b;
}

function me(text) {
  const r = row('me');
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  r.append(b);
  scrollDown();
}

function clearOptions() { options.replaceChildren(); }

/** Renders tappable answers and resolves with the chosen index, or -1 if rewound. */
function ask(list) {
  clearOptions();
  return new Promise((resolve) => {
    state.resolveAsk = resolve;
    list.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chip';
      btn.textContent = opt.label;
      btn.style.animationDelay = reduced ? '0ms' : `${i * 34}ms`;
      btn.addEventListener('click', () => {
        if (state.busy) return;
        state.busy = true;
        btn.dataset.picked = 'true';
        [...options.children].forEach((c) => { c.disabled = true; });
        setTimeout(() => {
          clearOptions();
          state.busy = false;
          state.resolveAsk = null;
          resolve(i);
        }, reduced ? 0 : 130);
      });
      options.append(btn);
    });
    options.firstElementChild?.focus({ preventScroll: true });
    scrollDown();
  });
}

function setProgress(answered) {
  const p = $('progress');
  const show = answered >= 0;
  const clamped = Math.min(Math.max(answered, 0), 4);
  p.dataset.show = show ? 'true' : 'false';
  p.setAttribute('aria-valuenow', String(clamped));
  $('progress-bar').style.width = `${(clamped / 4) * 100}%`;
}

function setStepLabel(text) { $('step-label').textContent = text; }

function track(payload) {
  const body = JSON.stringify({ session, ...payload });
  // Fire and forget; a failed beacon must never block the experience.
  if (navigator.sendBeacon) {
    navigator.sendBeacon('/api/track', new Blob([body], { type: 'application/json' }));
  } else {
    fetch('/api/track', { method: 'POST', headers: { 'content-type': 'application/json' }, body, keepalive: true }).catch(() => {});
  }
}

/* ---------- flow ---------- */

$('hero-eyebrow').textContent = HERO.eyebrow;
$('hero-headline').innerHTML = `${HERO.headline} <span class="hl">${HERO.headlineHighlight}</span>`;
$('hero-cta').textContent = HERO.cta;

$('hero-cta').addEventListener('click', () => {
  $('hero').style.display = 'none';
  $('chat').dataset.active = 'true';
  track({ event: 'start' });
  advance(0);
});

$('back').addEventListener('click', () => {
  if (state.busy || state.step === 0 || state.step >= QUESTIONS.length) return;

  // Abandon the in-flight step, then rewind one question.
  state.gen += 1;
  state.resolveAsk?.(-1);
  state.resolveAsk = null;

  state.step -= 1;
  state.answers.pop();
  // Drop every node created at this step or later.
  [...log.children].forEach((n) => { if (Number(n.dataset.step) >= state.step) n.remove(); });
  clearOptions();

  track({ event: 'back', screen: QUESTIONS[state.step].id });
  advance(state.step, { repeat: true });
});

function syncChrome() {
  const q = QUESTIONS[state.step];
  $('back').dataset.show = state.step > 0 && state.step < QUESTIONS.length ? 'true' : 'false';
  setProgress(state.answers.length);
  setStepLabel(q ? q.eyebrow : 'Hasil');
}

/** Runs one question and then hands off to the next step, the exit, or the result. */
async function advance(step, { repeat = false } = {}) {
  const gen = ++state.gen;
  const stale = () => gen !== state.gen;

  state.step = step;
  const q = QUESTIONS[step];
  syncChrome();

  await say(q.question, { pause: repeat ? 260 : 640, cls: 'q', sub: q.subtitle ?? '' });
  if (stale()) return;

  const choice = await ask(q.options);
  if (choice < 0 || stale()) return;

  const opt = q.options[choice];
  me(opt.label);
  state.answers.push(choice);
  setProgress(state.answers.length);

  track({
    event: 'answer',
    screen: q.id,
    ...(q.id === 'role' ? { role: opt.label, role_type: opt.role_type } : {}),
    ...(q.id === 'altitude' ? { altitude: opt.altitude } : {}),
    ...(q.id === 'ai' ? { ai_level: opt.ai_level } : {}),
    ...(q.id === 'aspiration' ? { aspiration: opt.label } : {}),
  });

  if (opt.exit) {
    state.step = step + 1;
    return showExit();
  }
  if (q.ack) {
    await say(q.ack, { pause: 460 });
    if (stale()) return;
  }

  if (step + 1 < QUESTIONS.length) return advance(step + 1);
  state.step = QUESTIONS.length;
  return showHandoff();
}

/* ---------- handoff ----------
   The chat stops here. Nothing about the result is shown: the path, the two
   generated blocks and the program all belong to /hasil, where the reveal has
   room to be paced. */

async function showHandoff() {
  $('back').dataset.show = 'false';
  setStepLabel('Hasil');
  setProgress(4);

  const key = state.answers.join('-');

  // Warm the result while the two closing lines type out, so the reveal page's
  // loading scene is a designed beat rather than a spinner over a cold model
  // call. Failure is silent; /hasil falls back to fetching it itself.
  fetch('/api/reveal', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ answers: state.answers }),
  })
    .then((r) => (r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`))))
    .then((data) => { try { sessionStorage.setItem(`hrp:res:${key}`, JSON.stringify(data)); } catch { /* ignore */ } })
    .catch(() => {});

  for (const line of HANDOFF.lines) await say(line, { pause: 520 });

  // No button: the last line lands, the curtain closes over the chat, and the
  // reveal opens on its own. One continuous move rather than a second decision.
  await wait(900);
  track({ event: 'reveal_open' });
  $('curtain').dataset.show = 'true';
  await wait(reduced ? 0 : 420);
  location.assign(`/hasil?a=${key}`);
}

/* ---------- exit ---------- */

async function showExit() {
  $('back').dataset.show = 'false';
  setProgress(-1);
  setStepLabel('Hasil');
  clearOptions();

  await say(EXIT.line1, { pause: 640 });

  // The CTA rides inside the second bubble so the redirect stays part of the
  // same sentence rather than becoming a separate panel.
  const b = await say(EXIT.line2, { pause: 560, stacked: true });
  const cta = document.createElement('a');
  cta.className = 'cta';
  cta.href = EXIT.ctaHref;
  cta.textContent = EXIT.cta;
  cta.addEventListener('click', () =>
    track({ event: 'other_programs_click', other_programs_clicked: true }));
  b.append(cta);
  scrollDown();

  track({ event: 'exit', exited_non_hr: true });
}
</script>
</body>
</html>
